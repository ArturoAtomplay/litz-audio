[workspace]
members = ["crates/*"]
default-members = ["crates/core", "crates/desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[workspace.dependencies]
pipewire = { version = "=0.10.1", features = ["v1_0_0"] }
rtrb = "=0.4.1"
quinn = { version = "=0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "io-util", "sync", "signal", "net"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rcgen = "=0.14.10"
sha2 = "=0.11.1"
getrandom = "=0.4.3"
bytes = "=1.12.1"
opus = "=0.4.0"
rubato = { version = "=5.0.1", default-features = false }

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

# DSP dependencies must meet real-time deadlines in developer builds too.
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# Tract 0.21.4's debug-only node-name check rejects its own generated Conv.bias
# names for DFN3. Production inference does not require globally unique labels.
# Keep Litz's assertions and the numerical/model regression tests enabled.
[profile.dev.package.tract-core]
opt-level = 2
debug-assertions = false
