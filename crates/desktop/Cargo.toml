[package]
name = "litzd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
test-tone = []

[dependencies]
litz-core = { path = "../core" }
quinn.workspace = true
rustls.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
rcgen.workspace = true
getrandom.workspace = true
rtrb.workspace = true
nnnoiseless = { version = "=0.5.2", default-features = false }
# Nothing imports tract directly. deep_filter breaks with any tract after
# 0.21.4, including 0.21.x patch releases.
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-pulse = "=0.21.4"
tract-hir = "=0.21.4"
ndarray = "=0.15.6"
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract"] }
mdns-sd = "=0.21.7"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire.workspace = true
libc = "=0.2.191"
zbus = { version = "=6.2.1", default-features = false, features = ["tokio", "proxy"] }
futures-lite = { version = "=2.6.1", default-features = false }

[target.'cfg(windows)'.dependencies]
wasapi = "=0.26.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_Threading"] }
windows-core = "=0.62.2"
windows = { version = "=0.62.2", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Notifications", "Win32_UI_Shell"] }
