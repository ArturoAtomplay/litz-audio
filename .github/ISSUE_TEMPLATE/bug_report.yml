name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Litz versions
      description: App version, and the output of `litzd --version` on the computer.
      placeholder: "App 0.1.0, litzd 0.1.0"
    validations:
      required: true
  - type: input
    id: phone
    attributes:
      label: Phone
      placeholder: "Pixel 8, Android 16"
    validations:
      required: true
  - type: input
    id: computer
    attributes:
      label: Computer
      placeholder: "Fedora 43, PipeWire 1.4 / Windows 11"
    validations:
      required: true
  - type: dropdown
    id: connection
    attributes:
      label: Connection
      options: [Wi-Fi, USB tethering, Other]
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Copy the report from Settings → About → Diagnostics in the app, and any `litzd` log output.
      render: text
