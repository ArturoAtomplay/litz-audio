version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    ignore:
      # deep_filter needs tract =0.21.4 (later 0.21.x break its API) and
      # ndarray 0.15.
      - dependency-name: "tract-*"
      - dependency-name: ndarray
      # #[implement] needs the windows-core that the windows crate uses, so
      # it moves only together with windows.
      - dependency-name: windows-core
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
