name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
env:
  LITZ_DATA_DIR: ${{ github.workspace }}/target/model
jobs:
  linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    # Ubuntu 24.04 is the oldest mainstream PipeWire 1.x base, so its glibc
    # (2.39) is the floor for the portable tarball.
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y libpipewire-0.3-dev libclang-dev pkg-config cmake rpm
      - run: packaging/fetch-model.sh target/model
      - run: cargo build --locked --profile dist -p litzd
      - name: Portable tarball
        run: |
          version="${GITHUB_REF_NAME#v}"
          root="target/dist/litz-$version-linux-${{ matrix.arch }}"
          install -Dm755 target/dist/litzd "$root/bin/litzd"
          install -Dm644 target/model/DeepFilterNet3_onnx.tar.gz "$root/share/litz/DeepFilterNet3_onnx.tar.gz"
          install -Dm644 LICENSE THIRD_PARTY_NOTICES -t "$root/share/licenses/litz"
          install -Dm644 licenses/desktop.txt "$root/share/licenses/litz/THIRD_PARTY_LICENSES"
          mkdir -p "$root/share/systemd/user"
          sed 's|@BINDIR@|%h/.local/bin|' packaging/linux/litzd.service.in > "$root/share/systemd/user/litzd.service"
          tar -C target/dist -czf "target/dist/litz-$version-linux-${{ matrix.arch }}.tar.gz" "$(basename "$root")"
      - name: Debian and RPM packages
        run: |
          cmake -S packaging/linux -B target/package -DLITZ_VERSION="${GITHUB_REF_NAME#v}" \
            -DLITZ_BINARY="$PWD/target/dist/litzd" -DLITZ_MODEL="$LITZ_DATA_DIR/DeepFilterNet3_onnx.tar.gz"
          (cd target/package && cpack -G "DEB;RPM")
          mv target/package/*.deb target/package/*.rpm target/dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            target/dist/*.tar.gz
            target/dist/*.deb
            target/dist/*.rpm
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: bash
        run: packaging/fetch-model.sh target/model
      - run: cargo build --locked --profile dist -p litzd
      - name: Installer
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/windows/litz.iss
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: dist/*
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - run: pip install ninja==1.13.0
      - run: rustup target add aarch64-linux-android x86_64-linux-android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - run: android/gradlew -p android :app:assembleFossRelease
      - name: Google Play bundle
        if: vars.ADMOB_APP_ID != ''
        run: android/gradlew -p android :app:bundlePlayRelease
        env:
          LITZ_ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          LITZ_ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
      - name: Sign APK and bundle
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || { echo "ANDROID_KEYSTORE_BASE64 secret is required to sign releases"; exit 1; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          version="${GITHUB_REF_NAME#v}"
          outputs=android/app/build/outputs
          mkdir -p dist play
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass env:KEYSTORE_PASSWORD --out "dist/litz-$version.apk" \
            "$outputs/apk/foss/release/app-foss-release-unsigned.apk"
          cp "$outputs/mapping/fossRelease/mapping.txt" "play/litz-$version-foss-mapping.txt"
          test -f "$outputs/bundle/playRelease/app-play-release.aab" || exit 0
          alias="$(keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD \
            | awk -F, '/PrivateKeyEntry/ { print $1; exit }')"
          jarsigner -keystore "$RUNNER_TEMP/release.jks" -storepass:env KEYSTORE_PASSWORD -keypass:env KEYSTORE_PASSWORD \
            -signedjar "play/litz-$version-play.aab" "$outputs/bundle/playRelease/app-play-release.aab" "$alias"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: dist/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play
          path: play/*
  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: '{linux-*,windows,android}'
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp packaging/install.sh dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
          packaging/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          case "$GITHUB_REF_NAME" in *-*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease --notes-file "$RUNNER_TEMP/notes.md" dist/*
